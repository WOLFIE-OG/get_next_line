name: Makefile CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Update apt
      run: sudo apt-get update --fix-missing
    
    - name: Install tree
      run: sudo apt-get install tree

    - name: Install norminette
      run: pip install norminette

    - name: Run tree
      run: tree

    - name: Run norminette
      run: norminette src include

    - name: Make program as module
      run: make module

    - name: View Contents of bin
      run: ls -la obj/

    - name: Clean output
      run: make clean

    - name: Make program as standalone
      run: make all

    - name: Re-make program
      run: make re

    - name: View Contents of standalone
      run: nm -C build/libftgnl.a

